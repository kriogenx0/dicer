name: Morbid
options:
  bundleIdPrefix: com.morbid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # Shared Perfect Ink look (tokens, controls, knob), from kriogenx0/volta-native.
  VoltaNative:
    url: https://github.com/kriogenx0/volta-native
    branch: main

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: true
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: false

targets:
  MorbidHost:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MorbidHost
        excludes:
          - "Info.plist"
      - path: StutterAU
        excludes:
          - "Info.plist"
          - "StutterAU.entitlements"
          - "StutterViewController.swift"
    info:
      path: MorbidHost/Info.plist
    entitlements:
      path: MorbidHost/MorbidHost.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morbid.Morbid
        PRODUCT_NAME: Morbid
        CODE_SIGN_ENTITLEMENTS: MorbidHost/MorbidHost.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
    dependencies:
      - target: StutterAU
        embed: true
        codeSign: true
      # MorbidHost compiles the StutterAU sources too, so it needs the package as well.
      - package: VoltaNative

  StutterAU:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: StutterAU
        excludes:
          - "Info.plist"
    info:
      path: StutterAU/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: StutterAU.StutterViewController
          NSExtensionAttributes:
            AudioComponentBundle: com.morbid.Morbid.StutterAU
            AudioComponents:
              - name: "Perfect Ink: Morbid Stutter"
                description: Stutter
                factoryFunction: StutterAU.StutterViewController
                manufacturer: Mrbd
                subtype: Stut
                type: aufx
                version: 1
                sandboxSafe: true
                tags:
                  - Effects
    dependencies:
      - package: VoltaNative
    entitlements:
      path: StutterAU/StutterAU.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morbid.Morbid.StutterAU
        PRODUCT_NAME: StutterAU
        CODE_SIGN_ENTITLEMENTS: StutterAU/StutterAU.entitlements
        SKIP_INSTALL: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  Morbid:
    build:
      targets:
        MorbidHost: all
        StutterAU: all
    run:
      config: Debug
      executable: MorbidHost
